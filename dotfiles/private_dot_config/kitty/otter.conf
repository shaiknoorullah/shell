# kitty surface for the otter launcher panel (loaded via `kitty --config`).
# Inherits your theme/font from kitty.conf, then overrides for a roomy panel.
include ~/.config/kitty/kitty.conf
remember_window_size    no
initial_window_width    90c
initial_window_height   28c
hide_window_decorations yes
tab_bar_style           hidden
scrollback_lines        0
close_on_child_death    yes
enable_audio_bell       no
window_margin_width     0
window_padding_width    12

